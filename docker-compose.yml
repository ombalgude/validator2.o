services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: authenticity-validator-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: authenticity-validator
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - authenticity-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authenticity-validator-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      # Support both key names used in the codebase
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/authenticity-validator?authSource=admin
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/authenticity-validator?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRE: 7d
      PORT: 5000
      AI_SERVICE_URL: http://ai-services:8001
      MAX_FILE_SIZE: 10485760
      UPLOAD_PATH: /app/uploads
      # Allow both local dev origin and the nginx proxy origin
      FRONTEND_URL: http://localhost:3000,http://localhost,http://localhost:80
      # ── Blockchain (optional) ────────────────────────────────────────────────
      # Set BLOCKCHAIN_ENABLED=true and supply the three vars below to enable
      # on-chain certificate recording.  Leave false to run without a node.
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-false}
      RPC_URL: ${RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
      - ai-services
    networks:
      - authenticity-network

  # AI Services (Python/FastAPI)
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: authenticity-validator-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    volumes:
      - ai_uploads:/app/uploads
    networks:
      - authenticity-network

  # Frontend (Vite/React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost/api
        VITE_SOCKET_URL: http://localhost
    container_name: authenticity-validator-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - authenticity-network

  # Redis (for caching / future session store)
  redis:
    image: redis:7-alpine
    container_name: authenticity-validator-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - authenticity-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: authenticity-validator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-services
    networks:
      - authenticity-network

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local
  ai_uploads:
    driver: local
  redis_data:
    driver: local

networks:
  authenticity-network:
    driver: bridge
